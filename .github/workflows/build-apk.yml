name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - name: Sync web asset
        run: |
          mkdir -p android/app/src/main/assets/www
          cp lumen.html android/app/src/main/assets/www/index.html
          ls -lh android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          ls "$ANDROID_HOME/cmdline-tools/" || true
          # cmdline-tools/16.0 exists on runner; link as latest if needed
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/16.0" "$ANDROID_HOME/cmdline-tools/latest" || true
          fi
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          sdkmanager --list_installed | tail -20

      - name: Install Gradle 8.7
        run: |
          cd /tmp
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk lumen-studio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-studio-apk
          path: lumen-studio.apk

      - name: Publish to Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          body: "Auto-built debug APK from master. Download below."
          files: lumen-studio.apk
