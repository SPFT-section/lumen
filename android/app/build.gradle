plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lumen.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumen.studio"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        debug {
            // Explicit v1+v2 so the APK installs from file managers on all API 24+ devices
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
