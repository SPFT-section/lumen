plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lumen.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumen.studio"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        // Stable key committed on purpose so every CI build can update the previous APK.
        // This is a free personal app; the key is not used for anything else.
        release {
            storeFile file('lumen-release.p12')
            storePassword 'lumen-studio-2026'
            keyAlias 'lumen'
            keyPassword 'lumen-studio-2026'
            storeType 'PKCS12'
            // Explicit v1+v2 so the APK installs from file managers on all API 24+ devices
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
