<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D — Image Glass Bottom (preview)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;500;600&display=swap">
<style>
:root{--h:265;--glass:.75}
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f2f2ef;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;padding:32px 20px}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:40px;align-items:start}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.cv{aspect-ratio:2/3;border-radius:6px 16px 16px 6px;overflow:hidden;position:relative;background:#111;color:#fff;
 box-shadow:0 30px 60px -20px rgba(0,0,0,.9),inset 4px 0 0 rgba(255,255,255,.08)}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bg.sunset{background:linear-gradient(180deg,#2b1a4d,#b3402e 55%,#f0a35e)}
.bg.ocean{background:linear-gradient(180deg,#04121f,#0a4a5e 55%,#37b8a5)}
.bg.forest{background:linear-gradient(180deg,#07130c,#1d4a26 55%,#8fce6e)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:23%;overflow:hidden;padding:12px 20px 36px;
 background:rgba(6,6,10,var(--glass));
 backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.pill{display:inline-block;font-size:9px;letter-spacing:.26em;padding:3px 10px;border-radius:99px;
 border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.85);margin-bottom:6px}
h1{font-family:"Noto Serif Thai",serif;font-weight:600;font-size:clamp(20px,3.4vw,26px);line-height:1.35;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.5);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{margin:4px 0 0;color:rgba(255,255,255,.78);font-family:"Noto Serif Thai",serif;font-size:13px;line-height:1.6;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{position:absolute;left:20px;right:20px;bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;
 border-top:1px solid rgba(255,255,255,.2);padding-top:7px;font-size:11px}
.au{letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au{letter-spacing:.22em;text-transform:uppercase}
.panel{border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;background:#0e0e0e}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#999;margin-bottom:6px}
.input{width:100%;background:#000;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;color:#fff}
input[type=range]{width:100%;accent-color:#fff}.note{color:#777;font-size:13px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#1c1c1e;color:#eee;border:1px solid rgba(255,255,255,.14);
 border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}.btn:hover{background:#2a2a2e}.btn.on{border-color:#fff}
</style></head><body><div class="wrap">
<div><div class="cv"><div class="bg sunset" id="bg"></div>
<div class="sheet">
<span class="pill">✦ NOVEL</span>
<h1 id="t">ราตรีแห่งดวงดาว</h1>
<p class="tag" id="g">เมื่อแสงสุดท้ายดับลง เรื่องราวของเราจึงเริ่มต้น</p>
<div class="ft"><span class="au" id="a">นามปากกา</span><span>2026</span></div>
</div></div></div>
<div class="panel"><h2 style="margin:0 0 4px">D — รูปเต็ม + ตัวอักษรล่าง (กระจก)</h2>
<p class="note">รูปไม่โดนบัง ตัวอักษรอยู่ในแผ่นกระจกด้านล่างอย่างเดียว ปรับความขุ่นได้ (ค่าเริ่มต้น 75%)</p>
<div class="field"><label>ชื่อเรื่อง</label><input class="input" id="in-t" value="ราตรีแห่งดวงดาว"></div>
<div class="field"><label>คำโปรย</label><input class="input" id="in-g" value="เมื่อแสงสุดท้ายดับลง เรื่องราวของเราจึงเริ่มต้น"></div>
<div class="field"><label>ผู้แต่ง</label><input class="input" id="in-a" value="นามปากกา"></div>
<div class="field"><label>ภาพตัวอย่าง</label><div class="row">
<button class="btn on" data-bg="sunset">อาทิตย์ตก</button>
<button class="btn" data-bg="ocean">ทะเล</button>
<button class="btn" data-bg="forest">ป่า</button>
<button class="btn" id="up">อัปโหลดรูป…</button>
<input type="file" id="file" accept="image/*" hidden></div></div>
<div class="field"><label>ความขุ่นกระจก (<span id="gv">75</span>%)</label>
<input type="range" id="in-glass" min="30" max="95" value="75"></div>
</div></div>
<script>const $=s=>document.querySelector(s);
$('#in-t').oninput=e=>$('#t').textContent=e.target.value||'เรื่องไม่มีชื่อ';
$('#in-g').oninput=e=>$('#g').textContent=e.target.value;
$('#in-a').oninput=e=>$('#a').textContent=e.target.value||'นามปากกา';
$('#in-glass').oninput=e=>{document.documentElement.style.setProperty('--glass',(e.target.value/100));$('#gv').textContent=e.target.value};
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-bg]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 const bg=$('#bg');bg.style.backgroundImage='';bg.className='bg '+b.dataset.bg;});
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
 const fr=new FileReader();fr.onload=()=>{const bg=$('#bg');bg.className='bg';bg.style.backgroundImage=`url('${fr.result}')`};fr.readAsDataURL(f);};
</script></body></html>
